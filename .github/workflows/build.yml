name: Build ECO-WORTHY Tray Monitor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows tray executable
        run: dotnet publish EcoWorthyCommunityEdition.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: EcoWorthyCommunityEdition-win-x64
          path: publish/EcoWorthyCommunityEdition.exe
          if-no-files-found: error
